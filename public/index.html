<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX Cloud Staff</title>
<style>:root{font:14px system-ui;color:#edf1f8;background:#0d1117}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;background:#141b27;border-bottom:1px solid #2a3445;display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:21px;margin:0}main{max-width:1250px;margin:24px auto;padding:0 20px}section{background:#192231;border:1px solid #313c4c;padding:20px;border-radius:13px;margin-bottom:18px}input,select,textarea{background:#0e1622;color:#fff;border:1px solid #455164;border-radius:7px;padding:10px;width:100%;min-width:0}button{background:#8b5cf6;color:white;border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:650}button.secondary{background:#303c50}button:focus-visible,input:focus-visible{outline:2px solid #a3e635}label{display:grid;gap:5px;color:#cad5e3}#auth{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}#edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}table{border-collapse:collapse;width:100%}th,td{padding:11px;text-align:left;border-bottom:1px solid #343e4d}th{color:#aabbcf}tr:hover{background:#273348}#tableWrap{overflow:auto}#msg{min-height:18px;color:#b8e988;margin:15px 0}small{color:#a5b1c2}#app{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.toolbar input{max-width:400px}@media(max-width:650px){#auth,#edit{grid-template-columns:1fr}header{align-items:start;flex-direction:column}}</style></head><body>
<header><div><strong style="color:#b7a4fa;letter-spacing:3px">APEX</strong><h1>Cloud Inventory</h1><small>Secure staff workspace</small></div><button class="secondary" id="signout" hidden>Sign out</button></header>
<main><section id="login"><h2>Sign in</h2><p>Use the account your APEX administrator authorised.</p><div id="auth"><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="signin">Sign in</button></div></section>
<div id="msg" role="status" aria-live="polite"></div><div id="app"><section><div class="toolbar"><input id="search" placeholder="Search asset ID, model, serial…" aria-label="Search assets"><button id="refresh" class="secondary">Refresh</button><small id="count"></small></div><div id="tableWrap"><table><thead><tr><th>Asset ID</th><th>Model</th><th>Serial</th><th>Location</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="editor" hidden><h2>Edit asset <span id="assetTitle"></span></h2><form id="edit"><label>Model<input name="model" required maxlength="140"></label><label>Manufacturer<input name="manufacturer" maxlength="90"></label><label>Serial<input name="serial" maxlength="90"></label><label>Location<input name="location" required maxlength="90"></label><label>Status<select name="status"><option>Awaiting Processing</option><option>Processed</option></select></label><label>Condition<select name="condition"><option>Not assessed</option><option>A</option><option>B</option><option>C</option><option>D</option><option>Excellent</option><option>Good</option><option>Fair</option></select></label><label style="grid-column:1/-1">Notes<textarea name="notes" maxlength="500" rows="3"></textarea></label><div class="actions"><button>Save changes</button><button class="secondary" id="cancel" type="button">Cancel</button></div></form></section></div></main>
<script src="./cloud-config.js"></script><script type="module" src="./staff-client.js"></script></body></html>
