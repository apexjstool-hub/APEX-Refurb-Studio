name: One-time APEX release page tidy
on:
  push:
    branches:
      - maintenance/prune-old-prereleases-2026-11-13
permissions:
  contents: write
jobs:
  prune-old-published-prereleases:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve five newest beta releases and prune older prereleases only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Explicit protected releases: latest five published betas and the stable fallback.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == true) | .tag_name' > /tmp/published-prereleases.txt
          count=0
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            case "$tag" in
              v4.1.12-beta.1|v4.1.12-beta.2|v4.1.12-beta.3|v4.1.12-beta.4|v4.1.11-beta.1)
                echo "KEEP $tag"
                continue ;;
            esac
            # Only published old prereleases are removed; drafts, stable, tags and Git history remain.
            echo "REMOVE old published pre-release $tag"
            gh release delete "$tag" --yes
            count=$((count+1))
          done < /tmp/published-prereleases.txt
          echo "Removed $count older published prereleases; retained protected releases, drafts and stable releases."
