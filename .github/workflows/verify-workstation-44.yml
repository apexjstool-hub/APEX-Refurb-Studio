name: Verify APEX Workstation 2.0 Integration
on:
  push:
    branches:
      - feature/4.4-workstation-2-integrated
    paths:
      - 'src/renderer/workstation-2*'
      - 'src/renderer/smart-workstation.js'
      - 'src/renderer/index.html'
      - 'tests/workstation-2-integration.test.js'
      - '.github/workflows/verify-workstation-44.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Verify changes confined to existing workstation
        run: |
          $pkg=Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '4.3.3' -or $pkg.build.appId -ne 'com.apex.inventory') { throw 'Existing stable identity unexpectedly changed.' }
          foreach ($p in @('src/renderer/workstation-2-engine.js','src/renderer/smart-workstation.js')) {
            node --check $p
            if ($LASTEXITCODE -ne 0) { throw "JS syntax invalid: $p" }
          }
          node --test tests/workstation-2-integration.test.js tests/smart-workstation.test.js tests/diagnostics-sync-2.test.js tests/refurb-workflow.test.js
          if ($LASTEXITCODE -ne 0) { throw 'New or existing refurbishment tests failed.' }
      - name: Verify Workstation 2.0 inside Electron with a sample asset
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-workstation-2-integration.js
          if ($LASTEXITCODE -ne 0) { throw 'Integrated workstation browser test failed.' }
      - name: Existing broad refurbishment harness (diagnostic only)
        continue-on-error: true
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-refurb-workspace.js
          if ($LASTEXITCODE -ne 0) { throw 'Legacy broad UI harness did not complete; investigate before stable release.' }
