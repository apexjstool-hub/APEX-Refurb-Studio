name: Publish verified APEX 4.4.7
on:
  push:
    branches: [release/4.4.7-parts-needed]
    paths: [.github/workflows/publish-verified-4.4.7.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: apex-447-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '0f293d06c379a0c35b4635dc2f40b6c685d154bb'
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: APEX-Management-Studio-4.4.7-Stable-Installer
          path: dist
          github-token: ${{ github.token }}
          run-id: '45595682468'
      - name: Verify and publish the exact Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/45595682468" --jq '.head_sha + " " + .conclusion')" = '0f293d06c379a0c35b4635dc2f40b6c685d154bb success'
          sha256sum --check <<'CHECKSUMS'
          004cf5bd833f13e621853e2b75ce829bb6824ecdb060e35df9e6c11b7ccb8c67  dist/APEX-Refurb-Studio-Setup-4.4.7.exe
          29319122e226d8772ce3a7de89adb1db3f1d50dbee6e663b2fdba6cafefcd6d8  dist/APEX-Refurb-Studio-Setup-4.4.7.exe.blockmap
          1e2aef85b71bdde74591dfbfdfafbacf4c52049606de35e9db8526a571a0b24a  dist/latest.yml
          CHECKSUMS
          node scripts/verify-release-files.js
          if gh release view v4.4.7 >/dev/null 2>&1; then
            echo 'v4.4.7 already exists. Refusing overwrite.'
            exit 1
          fi
          gh release create v4.4.7 dist/APEX-Refurb-Studio-Setup-4.4.7.exe dist/APEX-Refurb-Studio-Setup-4.4.7.exe.blockmap dist/latest.yml --draft --target '0f293d06c379a0c35b4635dc2f40b6c685d154bb' --title 'APEX Management Studio 4.4.7' --notes 'Show Parts Needed after bulk moves, preserve purchase records, and open the asset or pallet scanner directly from Parts Ordered.'
          gh release view v4.4.7 --json assets,isDraft,isPrerelease | jq -e '.isDraft and (.isPrerelease | not) and (([.assets[].name] | sort) == ["APEX-Refurb-Studio-Setup-4.4.7.exe","APEX-Refurb-Studio-Setup-4.4.7.exe.blockmap","latest.yml"])'
          gh release edit v4.4.7 --draft=false --latest
