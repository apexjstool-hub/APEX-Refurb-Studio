name: Build APEX Windows Update
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apex-windows-release
  cancel-in-progress: false
jobs:
  pallet-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: apex-isolated-pallet-test
          POSTGRES_DB: apex_pallet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: apex-isolated-pallet-test
      PGDATABASE: apex_pallet_test
    steps:
      - uses: actions/checkout@v5
      - name: Verify repeatable pallet-location migration and atomic moves
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/pallet-locations-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f cloud/pallet-locations-4.0.49.sql
          psql -v ON_ERROR_STOP=1 -f cloud/pallet-locations-4.0.49.sql
          psql -v ON_ERROR_STOP=1 -f tests/pallet-locations-regression.sql
  build:
    needs: pallet-storage
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Restore existing public sign-in configuration
        env:
          APEX_CLOUD_CONFIG: ${{ secrets.APEX_CLOUD_LOGIN_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APEX_CLOUD_CONFIG)) { throw 'Add the APEX_CLOUD_LOGIN_CONFIG repository secret first.' }
          $config = $env:APEX_CLOUD_CONFIG | ConvertFrom-Json
          $key = [string]$config.anonKey
          if ($key.StartsWith('sb_secret_')) { throw 'Server-only credentials cannot be bundled.' }
          if ($key.StartsWith('eyJ')) {
            $payload = $key.Split('.')[1].Replace('-', '+').Replace('_', '/')
            $payload = $payload.PadRight([int]([Math]::Ceiling($payload.Length / 4.0) * 4), '=')
            $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json
            if ($claims.role -ne 'anon') { throw 'Only an anon or publishable key is allowed.' }
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'src/cloud-login-distribution.json'), $env:APEX_CLOUD_CONFIG)
          node scripts/configure-distribution-login.js --check
          if ($LASTEXITCODE -ne 0) { throw 'Sign-in configuration validation failed.' }
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source and core workflows
        run: |
          Get-ChildItem src,hub,cloud,scripts -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.Name)" }
          }
          node --test tests/hub-diagnostics-reentry.test.js tests/inventory-arrivals.test.js tests/device-summary.test.js tests/assignment-documents.test.js tests/inventory-tracker.test.js tests/template-parts-export.test.js tests/part-receipts.test.js tests/refurb-parts-bridge.test.js tests/admin-centre.test.js tests/account-security.test.js tests/label-print.test.js tests/history-only-visibility.test.js tests/diagnostic-intake.test.js tests/refurb-workflow.test.js tests/bulk-parts-board.test.js tests/pallet-locations.test.js tests/smart-inventory.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Verify thermal label layout and single-page PDF output
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-label-layout.js
          if ($LASTEXITCODE -ne 0) { throw 'Thermal label layout checks failed.' }
      - name: Verify inventory report PDF rendering
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-inventory-print.js
          if ($LASTEXITCODE -ne 0) { throw 'Inventory print/PDF verification failed.' }
      - name: Verify Inventory workflow rendering and receipt action
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-inventory-tracker.js
          if ($LASTEXITCODE -ne 0) { throw 'Inventory workflow UI checks failed.' }
      - name: Verify additive Refurbishment workspace and original Inventory views
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\\node_modules\\.bin\\electron.cmd tests/check-refurb-workspace.js
          if ($LASTEXITCODE -ne 0) { throw 'Refurbishment workspace checks failed.' }
      - name: Verify sign-in layout and manual saved login
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\\node_modules\\.bin\\electron.cmd tests/check-login-layout.js
          if ($LASTEXITCODE -ne 0) { throw 'Sign-in layout verification failed.' }
      - name: Verify pallet labels and A4 manifests
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\\node_modules\\.bin\\electron.cmd tests/check-assignment-print.js
          if ($LASTEXITCODE -ne 0) { throw 'Pallet label/manifest verification failed.' }
      - name: Verify branded desktop notification and report layouts
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-notification-reports.js
          if ($LASTEXITCODE -ne 0) { throw 'Notification/report branding checks failed.' }
      - uses: actions/upload-artifact@v6
        with:
          name: apex-assignment-print-qa
          path: qa-print/
          if-no-files-found: error
          retention-days: 7
      - name: Build installed Windows release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run pack:windows -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed.' }
      - name: Verify sync worker inside the packaged Windows application
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $verification = Start-Process -FilePath ".\\dist\\win-unpacked\\APEX Refurb Management Studio.exe" -ArgumentList @("scripts/verify-packaged-sync.js") -NoNewWindow -Wait -PassThru
          if ($verification.ExitCode -ne 0) { throw "Packaged sync worker verification failed (exit $($verification.ExitCode)). No release will be uploaded." }
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
      - name: Verify installer and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable numeric version is required.' }
          $tag = "v$version"
          $installer = "dist/APEX-Refurb-Studio-Setup-$version.exe"
          if (!(Test-Path $installer) -or !(Test-Path 'dist/latest.yml')) { throw 'Required update files missing.' }
          $env:APEX_RELEASE_VERSION = $version
          node scripts/verify-release-files.js
          if ($LASTEXITCODE -ne 0) { throw 'Update metadata verification failed.' }
          $existing = gh release view $tag --json isDraft 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and -not (($existing | ConvertFrom-Json).isDraft)) { throw "Release $tag is already published. Use a newer version." }
          $notes = "APEX $version Windows installer. Refreshed Work queue with clearer status, progress and selection controls. View pallets now opens a dedicated location page showing pallet cards, inventory counts and View inventory links. Existing pallet storage and device assignments are retained. Cloud users upgrading from v4.0.49 need no database update; earlier cloud deployments can use the attached pallet-locations-4.0.49.sql migration. Test the installer before publishing this draft."
          if ($exists) {
            gh release edit $tag --target $env:GITHUB_SHA --title "APEX $version" --notes $notes
          } else {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "APEX $version" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft release preparation failed.' }
          $files = @($installer, 'dist/latest.yml', 'cloud/pallet-locations-4.0.49.sql')
          if (Test-Path "$installer.blockmap") { $files += "$installer.blockmap" }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed. Do not publish the incomplete draft.' }
