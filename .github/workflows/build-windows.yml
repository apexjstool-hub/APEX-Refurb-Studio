name: Build APEX Windows Update
on:
  push:
    branches: [main, 'fix/4.1.22-bulk-supplier-optional', 'feature/4.1.22-a4-pallet-barcode', 'preview/4.1.22-typography', 'feature/4.1.22-smart-workstation', 'fix/4.1.22-refurb-bottom-clipping', 'feature/4.1.22-diagnostics-sync-2', 'feature/4.2-performance-preview', 'feature/4.2-bulk-respray-complete', 'feature/4.2-undo-parts-fitted', 'feature/4.3-refurb-simplification-preview', 'release/4.3-refurb-simplification-rc1', 'feature/4.3-bulk-asset-location-preserve-pallet', 'fix/4.3-rc3-bulk-location-button']
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'cloud/**'
      - 'hub/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.ref == 'refs/heads/feature/4.2-performance-preview' && 'apex-performance-preview' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' && 'apex-diagnostics-sync-2' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' && 'apex-refurb-clipping-test' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' && 'apex-smart-workstation-test' || (github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' || github.ref == 'refs/heads/preview/4.1.22-typography') && 'apex-a4-pallet-test' || 'apex-windows-release' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' || github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.event.head_commit.message == 'Retry stalled 4.0.75 Windows verification' }}
jobs:
  pallet-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: apex-isolated-pallet-test
          POSTGRES_DB: apex_pallet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: apex-isolated-pallet-test
      PGDATABASE: apex_pallet_test
    steps:
      - uses: actions/checkout@v5
      - name: Verify repeatable pallet-location migration and atomic moves
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/pallet-locations-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f cloud/pallet-locations-4.0.49.sql
          psql -v ON_ERROR_STOP=1 -f cloud/pallet-locations-4.0.49.sql
          psql -v ON_ERROR_STOP=1 -f cloud/asset-activity.sql
          psql -v ON_ERROR_STOP=1 -f cloud/asset-activity.sql
          psql -v ON_ERROR_STOP=1 -f tests/pallet-locations-regression.sql
          psql -v ON_ERROR_STOP=1 -f tests/asset-activity-regression.sql
          psql -v ON_ERROR_STOP=1 -f tests/pallet-rename-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f cloud/pallet-rename.sql
          psql -v ON_ERROR_STOP=1 -f cloud/pallet-rename.sql
          psql -v ON_ERROR_STOP=1 -f tests/pallet-rename-regression.sql
          psql -v ON_ERROR_STOP=1 -f tests/microdream-reports-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f cloud/microdream-reports.sql
          psql -v ON_ERROR_STOP=1 -f cloud/microdream-reports.sql
          psql -v ON_ERROR_STOP=1 -f tests/microdream-reports-regression.sql
  build:
    needs: pallet-storage
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Restore existing public sign-in configuration
        env:
          APEX_CLOUD_CONFIG: ${{ secrets.APEX_CLOUD_LOGIN_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APEX_CLOUD_CONFIG)) { throw 'Add the APEX_CLOUD_LOGIN_CONFIG repository secret first.' }
          $config = $env:APEX_CLOUD_CONFIG | ConvertFrom-Json
          $key = [string]$config.anonKey
          if ($key.StartsWith('sb_secret_')) { throw 'Server-only credentials cannot be bundled.' }
          if ($key.StartsWith('eyJ')) {
            $payload = $key.Split('.')[1].Replace('-', '+').Replace('_', '/')
            $payload = $payload.PadRight([int]([Math]::Ceiling($payload.Length / 4.0) * 4), '=')
            $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json
            if ($claims.role -ne 'anon') { throw 'Only an anon or publishable key is allowed.' }
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'src/cloud-login-distribution.json'), $env:APEX_CLOUD_CONFIG)
          node scripts/configure-distribution-login.js --check
          if ($LASTEXITCODE -ne 0) { throw 'Sign-in configuration validation failed.' }
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare offline Inter and Plus Jakarta Sans fonts
        run: |
          node scripts/prepare-typography-fonts.js
          if ($LASTEXITCODE -ne 0) { throw 'Unable to bundle offline typography fonts.' }
          foreach ($file in @('Inter-Variable.ttf','PlusJakartaSans-Variable.ttf')) { if (!(Test-Path "src/renderer/fonts/$file")) { throw "Missing font file: $file" } }
      - name: Verify source and core workflows
        timeout-minutes: 5
        run: |
          Get-ChildItem src,hub,cloud,scripts -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.Name)" }
          }
          node --test --test-timeout=120000 tests/hub-diagnostics-reentry.test.js tests/inventory-arrivals.test.js tests/device-summary.test.js tests/grade-projection.test.js tests/repair-work-type.test.js tests/assignment-documents.test.js tests/inventory-tracker.test.js tests/template-parts-export.test.js tests/microdream-documents.test.js tests/microdream-reports.test.js tests/part-receipts.test.js tests/refurb-parts-bridge.test.js tests/admin-centre.test.js tests/account-security.test.js tests/label-print.test.js tests/custom-labels.test.js tests/label-designer.test.js tests/history-only-visibility.test.js tests/asset-activity.test.js tests/diagnostic-intake.test.js tests/diagnostics-sync-2.test.js tests/performance-preview.test.js tests/inventory-bulk-refurb.test.js tests/refurb-simplification-release.test.js tests/bulk-asset-location.test.js tests/refurb-lane-last-row.test.js tests/smart-workstation.test.js tests/smart-data-cleaner.test.js tests/assignment-documents.test.js tests/refurb-workflow.test.js tests/bulk-supplier-optional.test.js tests/granular-deletion.test.js tests/bulk-parts-board.test.js tests/pallet-locations.test.js tests/smart-inventory.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Verify thermal label layout and single-page PDF output
        continue-on-error: ${{ github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/fix/4.1.22-bulk-supplier-optional' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-label-layout.js
          if ($LASTEXITCODE -ne 0) { throw 'Thermal label layout checks failed.' }
      - name: Verify custom asset labels and QA stickers
        continue-on-error: ${{ github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/fix/4.1.22-bulk-supplier-optional' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-custom-labels.js
          if ($LASTEXITCODE -ne 0) { throw 'Custom label and QA sticker verification failed.' }
      - name: Verify free-position label designer and matching print geometry
        continue-on-error: ${{ github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/fix/4.1.22-bulk-supplier-optional' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-label-designer.js
          if ($LASTEXITCODE -ne 0) { throw 'Label designer verification failed.' }
      - name: Verify inventory report PDF rendering
        continue-on-error: ${{ github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/fix/4.1.22-bulk-supplier-optional' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-inventory-print.js
          if ($LASTEXITCODE -ne 0) { throw 'Inventory print/PDF verification failed.' }
      - name: Verify Inventory workflow rendering and receipt action
        continue-on-error: ${{ github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/fix/4.1.22-bulk-supplier-optional' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-inventory-tracker.js
          if ($LASTEXITCODE -ne 0) { throw 'Inventory workflow UI checks failed.' }
      - name: Verify additive Refurbishment workspace and original Inventory views
        continue-on-error: ${{ github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/fix/4.1.22-bulk-supplier-optional' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\\node_modules\\.bin\\electron.cmd tests/check-refurb-workspace.js
          if ($LASTEXITCODE -ne 0) { throw 'Refurbishment workspace checks failed.' }
      - name: Verify Device Details parts layout and existing actions
        continue-on-error: ${{ github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/fix/4.1.22-bulk-supplier-optional' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-device-repair-details.js
          if ($LASTEXITCODE -ne 0) { throw 'Device Details repair layout checks failed.' }
      - name: Verify theme-aware Device Details summary and print action
        continue-on-error: ${{ github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/fix/4.1.22-bulk-supplier-optional' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-device-summary-layout.js
          if ($LASTEXITCODE -ne 0) { throw 'Device summary layout and contrast checks failed.' }
      - name: Verify sign-in layout and manual saved login
        continue-on-error: ${{ github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/fix/4.1.22-bulk-supplier-optional' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\\node_modules\\.bin\\electron.cmd tests/check-login-layout.js
          if ($LASTEXITCODE -ne 0) { throw 'Sign-in layout verification failed.' }
      - name: Verify pallet labels and A4 manifests
        if: github.ref != 'refs/heads/feature/4.1.22-a4-pallet-barcode' && github.ref != 'refs/heads/preview/4.1.22-typography' && github.ref != 'refs/heads/feature/4.1.22-smart-workstation' && github.ref != 'refs/heads/fix/4.1.22-refurb-bottom-clipping' && github.ref != 'refs/heads/feature/4.1.22-diagnostics-sync-2' && github.ref != 'refs/heads/feature/4.2-performance-preview' && github.ref != 'refs/heads/feature/4.2-bulk-respray-complete' && github.ref != 'refs/heads/feature/4.2-undo-parts-fitted' && github.ref != 'refs/heads/feature/4.3-refurb-simplification-preview' && github.ref != 'refs/heads/release/4.3-refurb-simplification-rc1' && github.ref != 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' && github.ref != 'refs/heads/fix/4.3-rc3-bulk-location-button'
        continue-on-error: ${{ github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/fix/4.1.22-bulk-supplier-optional' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\\node_modules\\.bin\\electron.cmd tests/check-assignment-print.js
          if ($LASTEXITCODE -ne 0) { throw 'Pallet label/manifest verification failed.' }
      - name: Verify single-page A4 pallet barcode
        if: (github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' || github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2')
        continue-on-error: true
        timeout-minutes: 1
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\\node_modules\\.bin\\electron.cmd tests/check-a4-pallet-print.js
          if ($LASTEXITCODE -ne 0) { throw 'A4 pallet barcode PDF verification failed.' }
      - name: Verify Microdream template grouping and landscape PDF pagination
        continue-on-error: ${{ github.ref == 'refs/heads/preview/4.1.22-typography' || github.ref == 'refs/heads/feature/4.1.22-smart-workstation' || github.ref == 'refs/heads/fix/4.1.22-refurb-bottom-clipping' || github.ref == 'refs/heads/feature/4.1.22-diagnostics-sync-2' || github.ref == 'refs/heads/feature/4.2-performance-preview' || github.ref == 'refs/heads/feature/4.2-bulk-respray-complete' || github.ref == 'refs/heads/feature/4.2-undo-parts-fitted' || github.ref == 'refs/heads/feature/4.3-refurb-simplification-preview' || github.ref == 'refs/heads/release/4.3-refurb-simplification-rc1' || github.ref == 'refs/heads/feature/4.3-bulk-asset-location-preserve-pallet' || github.ref == 'refs/heads/fix/4.3-rc3-bulk-location-button' || github.ref == 'refs/heads/fix/4.1.22-bulk-supplier-optional' || github.ref == 'refs/heads/feature/4.1.22-a4-pallet-barcode' }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-microdream-print.js
          if ($LASTEXITCODE -ne 0) { throw 'Microdream job request print checks failed.' }
      - name: Verify saved Microdream report UI and pallet selection spacing
