name: Build APEX Windows Update
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apex-windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Restore existing public sign-in configuration
        env:
          APEX_CLOUD_CONFIG: ${{ secrets.APEX_CLOUD_LOGIN_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APEX_CLOUD_CONFIG)) { throw 'Add the APEX_CLOUD_LOGIN_CONFIG repository secret first.' }
          $config = $env:APEX_CLOUD_CONFIG | ConvertFrom-Json
          $key = [string]$config.anonKey
          if ($key.StartsWith('sb_secret_')) { throw 'Server-only credentials cannot be bundled.' }
          if ($key.StartsWith('eyJ')) {
            $payload = $key.Split('.')[1].Replace('-', '+').Replace('_', '/')
            $payload = $payload.PadRight([int]([Math]::Ceiling($payload.Length / 4.0) * 4), '=')
            $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json
            if ($claims.role -ne 'anon') { throw 'Only an anon or publishable key is allowed.' }
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'src/cloud-login-distribution.json'), $env:APEX_CLOUD_CONFIG)
          node scripts/configure-distribution-login.js --check
          if ($LASTEXITCODE -ne 0) { throw 'Sign-in configuration validation failed.' }
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source and core workflows
        run: |
          Get-ChildItem src,hub,scripts -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.Name)" }
          }
          node --test tests/label-print.test.js tests/history-only-visibility.test.js tests/diagnostic-intake.test.js tests/refurb-workflow.test.js tests/smart-inventory.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Verify thermal label layout and single-page PDF output
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & .\node_modules\.bin\electron.cmd tests/check-label-layout.js
          if ($LASTEXITCODE -ne 0) { throw 'Thermal label layout checks failed.' }
      - name: Build installed Windows release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run pack:windows -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed.' }
      - name: Verify installer and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable numeric version is required.' }
          $tag = "v$version"
          $installer = "dist/APEX-Refurb-Studio-Setup-$version.exe"
          if (!(Test-Path $installer) -or !(Test-Path 'dist/latest.yml')) { throw 'Required update files missing.' }
          $env:APEX_RELEASE_VERSION = $version
          node scripts/verify-release-files.js
          if ($LASTEXITCODE -ne 0) { throw 'Update metadata verification failed.' }
          gh release view $tag --json isDraft > $null 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Delete its draft to rebuild, or use a new version." }
          $notes = "APEX $version Windows NSIS update. Download and test the installer, then publish this draft as a normal stable release to enable Settings > APEX Update Centre."
          gh release create $tag --draft --target $env:GITHUB_SHA --title "APEX $version" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          $files = @($installer, 'dist/latest.yml')
          if (Test-Path "$installer.blockmap") { $files += "$installer.blockmap" }
          gh release upload $tag @files
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed. Do not publish the incomplete draft.' }
