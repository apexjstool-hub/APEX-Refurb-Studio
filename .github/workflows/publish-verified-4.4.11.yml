name: Publish verified APEX 4.4.11
on:
  push:
    branches: [release/4.4.11-pallet-reports-export]
    paths: [.github/workflows/publish-verified-4.4.11.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: apex-4411-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '53cf912fc3fdd397051b9cecebe130f16f58efab'
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: APEX-Management-Studio-4.4.11-Stable-Installer
          path: dist
          github-token: ${{ github.token }}
          run-id: '45608021982'
      - name: Verify and publish the exact Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/45608021982" --jq '.head_sha + " " + .conclusion')" = '53cf912fc3fdd397051b9cecebe130f16f58efab success'
          sha256sum --check <<'CHECKSUMS'
          076ac3973a07d66e520b4d50d63e5c4446d4e8b635767c3b3494f43d7c92d442  dist/APEX-Refurb-Studio-Setup-4.4.11.exe
          d47a9cbe8101fcfc26c203f407f9c9ebcb79c8717354e031cfb25a8ce5f57ef5  dist/APEX-Refurb-Studio-Setup-4.4.11.exe.blockmap
          532133dcdeac10d239a4c04ada5a3499130425a1c464676f875e78c557e875f3  dist/latest.yml
          CHECKSUMS
          node scripts/verify-release-files.js
          if gh release view v4.4.11 >/dev/null 2>&1; then
            echo 'v4.4.11 already exists. Refusing overwrite.'
            exit 1
          fi
          gh release create v4.4.11 dist/APEX-Refurb-Studio-Setup-4.4.11.exe dist/APEX-Refurb-Studio-Setup-4.4.11.exe.blockmap dist/latest.yml --draft --target '53cf912fc3fdd397051b9cecebe130f16f58efab' --title 'APEX Management Studio 4.4.11' --notes 'Export Parts Needed to Excel from Pallets > Actions > Reports. Editing an asset keeps its pallet and location independent.'
          gh release view v4.4.11 --json assets,isDraft,isPrerelease | jq -e '.isDraft and (.isPrerelease | not) and (([.assets[].name] | sort) == ["APEX-Refurb-Studio-Setup-4.4.11.exe","APEX-Refurb-Studio-Setup-4.4.11.exe.blockmap","latest.yml"])'
          gh release edit v4.4.11 --draft=false --latest
