name: Publish APEX 4.4.4 Completed QA Archive Stable
on:
  push:
    branches:
      - release/4.4.4-completed-qa-signoff
    paths:
      - '.github/workflows/publish-completed-qa-final-signoff-444.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: apex-444-stable-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Confirm verified unchanged production identity and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tested = '9aa6eecb1c899649b9ab5a40f48934bd3931260d'
          git merge-base --is-ancestor $tested HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Release branch does not descend from the verified build.' }
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          if ($p.version -ne '4.4.4' -or $p.build.appId -ne 'com.apex.inventory' -or $p.build.publish[0].releaseType -ne 'release') { throw 'Incorrect stable update channel or app identity.' }
          $verification = gh api repos/$env:GITHUB_REPOSITORY/actions/runs/45177639176 --jq '{conclusion:.conclusion,head_sha:.head_sha}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify Windows build.' }
          $v = $verification | ConvertFrom-Json
          if ($v.conclusion -ne 'success' -or $v.head_sha -ne $tested) { throw 'The pinned Windows build was not successful.' }
          $current = gh api repos/$env:GITHUB_REPOSITORY/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $current -ne 'v4.4.3') { throw 'Stable channel has changed: review before replacing it.' }
          $versions = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing tags.' }
          if (@($versions | ForEach-Object { $_.tagName }) -contains 'v4.4.4') { throw '4.4.4 already exists: do not overwrite.' }
      - name: Retrieve previously tested installer, blockmap and latest metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          gh run download 45177639176 --repo $env:GITHUB_REPOSITORY --name APEX-4.4.4-Completed-QA-Final-Signoff-Verified-Candidate --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not download tested build artifacts.' }
          foreach ($f in @('APEX-Refurb-Studio-Setup-4.4.4.exe','APEX-Refurb-Studio-Setup-4.4.4.exe.blockmap','latest.yml')) {
            if (!(Test-Path (Join-Path dist $f))) { throw "Missing required release file: $f" }
          }
          $manifest = Get-Content dist/latest.yml -Raw
          if ($manifest -notmatch 'version: 4\.4\.4') { throw 'Update feed is not version 4.4.4.' }
          node scripts/verify-release-files.js
          if ($LASTEXITCODE -ne 0) { throw 'Installer/manifest integrity mismatch.' }
      - name: Publish official APEX Settings update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versions = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if (@($versions | ForEach-Object { $_.tagName }) -contains 'v4.4.4') { throw 'Stable version already exists.' }
          $notes = @'
          APEX Management Studio 4.4.4 — Completed QA Final Sign-Off
          
          The Completed QA tab remains inside Inventory. Scan an active Asset ID or serial number, choose Move to Completed QA, and explicitly confirm that all repairs, respray work and four QA checks were physically completed.
          
          This signed finalisation updates the existing canonical refurbishment record: outstanding repair and cosmetic/respray requirements are operator-attested as completed and fitted; the four checks (Visual inspection, Required parts fitted, Hardware retest, Final clean & sign-off) are confirmed; the refurbishment job becomes Completed. The separate asset processing status is set to Processed and its saved Location is changed to Completed QA. The original pallet ID and asset history are retained. The asset is archived from active inventory and remains in the Completed QA register and printable A4 manifest.
          
          Safety: Do not approve sign-off unless the actual work and QC inspection have been performed. The action rejects on-hold jobs, stale job data and any saved failed diagnostic results. Failed tests must be retested and explicitly synced in APEX Diagnostics before finalisation. Original diagnostic pass/fail values are never changed by archiving. Sign-off and repair/respray completions are recorded in the workflow audit timeline. It does not fabricate historical supplier order-line receipts. If the later asset-location save fails, the user is notified to retry the move.
          
          No database migration, no deletion of inventory records, no change to app ID or existing Settings update channel. Test one real device and review its manifest before using this on a batch. Update via Settings > APEX Update Centre > Check for updates. Version 4.4.3 remains accessible for rollback.
          '@
          gh release create v4.4.4 dist/APEX-Refurb-Studio-Setup-4.4.4.exe dist/APEX-Refurb-Studio-Setup-4.4.4.exe.blockmap dist/latest.yml --repo $env:GITHUB_REPOSITORY --target 9aa6eecb1c899649b9ab5a40f48934bd3931260d --latest --title 'APEX Management Studio 4.4.4 - Completed QA Final Sign-Off' --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Stable release publishing failed.' }
      - name: Verify stable GitHub release and update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = gh release view v4.4.4 --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($r.tagName -ne 'v4.4.4' -or $r.isDraft -or $r.isPrerelease) { throw 'Release was not published as stable.' }
          $names = @($r.assets | ForEach-Object { $_.name })
          foreach ($name in @('APEX-Refurb-Studio-Setup-4.4.4.exe','APEX-Refurb-Studio-Setup-4.4.4.exe.blockmap','latest.yml')) {
            if ($names -notcontains $name) { throw "Published update bundle missing $name" }
          }
          if ((gh api repos/$env:GITHUB_REPOSITORY/releases/latest --jq .tag_name) -ne 'v4.4.4') { throw 'Stable GitHub latest channel not updated.' }
          Write-Host 'Verified official APEX 4.4.4 stable update, Windows Setup EXE and latest.yml.'
