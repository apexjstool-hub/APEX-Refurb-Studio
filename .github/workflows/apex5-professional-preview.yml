name: APEX 5.0 Green Professional Preview 3 Windows EXE
on:
  push:
    branches:
      - preview/apex5-green-inventory-v3
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without production cloud credentials
        run: npm ci
      - name: Verify source JavaScript syntax
        run: |
          Get-ChildItem src,scripts -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax failed: $($_.FullName)" }
          }
      - name: Verify preview isolation, demo fixtures and professional screens
        run: |
          node --test tests/apex5-preview-isolation.test.js tests/apex5-green-reference-v3.test.js
          if ($LASTEXITCODE -ne 0) { throw 'APEX 5 preview isolation tests failed. Do not package.' }
      - name: Run retained inventory and refurbishment regression tests
        run: |
          node --test tests/refurb-workflow.test.js tests/repair-work-type.test.js tests/dispatch-centre-v4116.test.js tests/pallet-locations.test.js tests/pallets-locations-v4118.test.js tests/inventory-status-display.test.js tests/inventory-table-cleanup.test.js tests/device-summary.test.js tests/report-asset-barcodes-v4112.test.js tests/label-barcode-sizing.test.js tests/label-print.test.js tests/inventory-column-spacing-v4122-beta3.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Core workflow regression failed. Do not publish.' }
      - name: Verify offline build excludes worker files and publisher
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.build.appId -ne 'com.apex.management.preview5') { throw 'Unsafe preview appId.' }
          if ($package.build.productName -ne 'APEX Management Studio 5 Preview') { throw 'Unsafe preview product name.' }
          if ($package.build.publish) { throw 'Preview must not have a production publisher.' }
          if ($package.build.files -match 'cloud/' -or $package.build.files -match 'hub/') { throw 'Preview must exclude hub and cloud workers.' }
          $distribution = Get-Content src/cloud-login-distribution.json -Raw | ConvertFrom-Json
          if ($distribution.url -or $distribution.anonKey) { throw 'Production cloud login values bundled.' }
      - name: Build isolated Windows preview installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run pack:windows
          if ($LASTEXITCODE -ne 0) { throw 'Preview Windows installer build failed.' }
          if (!(Test-Path 'dist/APEX-Management-Studio-5-Preview-Setup-5.0.0-preview.3.exe')) { throw 'Expected preview EXE not found.' }
      - name: Verify packaged preview boundaries
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $verification = Start-Process -FilePath ".\dist\win-unpacked\APEX Management Studio 5 Preview.exe" -ArgumentList @("scripts/verify-apex5-preview-package.js") -NoNewWindow -Wait -PassThru
          if ($verification.ExitCode -ne 0) { throw "Packaged isolation verification failed: $($verification.ExitCode)" }
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
      - name: Store preview EXE as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: APEX-Management-Studio-5-Professional-Preview-Windows
          path: dist/APEX-Management-Studio-5-Preview-Setup-5.0.0-preview.3.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish separate GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'v5.0.0-preview.3'
          $installer = 'dist/APEX-Management-Studio-5-Preview-Setup-5.0.0-preview.3.exe'
          if (!(Test-Path $installer)) { throw 'Preview EXE is missing.' }
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Preview tag $tag already exists. Do not overwrite." }
          $notes = "APEX Management Studio 5.0 Green Professional Preview 3 — a separate, completely offline demo based on v4.1.22 Beta 4. Implements the user-approved dark slate and green enterprise inventory reference with professional sidebar, deep-green actions, balanced full-width inventory table, visible filters for device type/brand/status/location, functional search, original live workflow status tabs and repair badges. Asset ID, model, serial, location, pallet, status and waiting-time information remain sourced from actual demo records, not fictional progress figures. Existing inventory, barcode, refurbishment, Microdream, reporting and label functions retained. Separate Windows appId/installer/user profile. Synthetic sample laptops only. Production Supabase and hubs disabled; network blocked; cloud workers excluded; updater disabled. Source, regression and packaged isolation checks required before release. Compare Inventory at your own display resolution before giving design approval."
          gh release create $tag $installer --prerelease --target $env:GITHUB_SHA --title 'APEX Management Studio 5.0 Green Professional Preview 3' --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Separate preview release publishing failed.' }
