name: Publish APEX 4.4.3 Completed QA Archive Stable
on:
  push:
    branches:
      - release/4.4.3-simple-qa-scan
    paths:
      - '.github/workflows/publish-completed-qa-simple-scan-443.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: apex-443-stable-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Confirm verified unchanged production identity and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tested = '129165802a78b775ed34ad131361b4f1f251c824'
          git merge-base --is-ancestor $tested HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Release branch does not descend from the verified build.' }
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          if ($p.version -ne '4.4.3' -or $p.build.appId -ne 'com.apex.inventory' -or $p.build.publish[0].releaseType -ne 'release') { throw 'Incorrect stable update channel or app identity.' }
          $verification = gh api repos/$env:GITHUB_REPOSITORY/actions/runs/45142466750 --jq '{conclusion:.conclusion,head_sha:.head_sha}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify Windows build.' }
          $v = $verification | ConvertFrom-Json
          if ($v.conclusion -ne 'success' -or $v.head_sha -ne $tested) { throw 'The pinned Windows build was not successful.' }
          $current = gh api repos/$env:GITHUB_REPOSITORY/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $current -ne 'v4.4.2') { throw 'Stable channel has changed: review before replacing it.' }
          $versions = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing tags.' }
          if (@($versions | ForEach-Object { $_.tagName }) -contains 'v4.4.3') { throw '4.4.3 already exists: do not overwrite.' }
      - name: Retrieve previously tested installer, blockmap and latest metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          gh run download 45142466750 --repo $env:GITHUB_REPOSITORY --name APEX-4.4.3-Completed-QA-Simple-Scan-Verified-Candidate --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not download tested build artifacts.' }
          foreach ($f in @('APEX-Refurb-Studio-Setup-4.4.3.exe','APEX-Refurb-Studio-Setup-4.4.3.exe.blockmap','latest.yml')) {
            if (!(Test-Path (Join-Path dist $f))) { throw "Missing required release file: $f" }
          }
          $manifest = Get-Content dist/latest.yml -Raw
          if ($manifest -notmatch 'version: 4\.4\.3') { throw 'Update feed is not version 4.4.3.' }
          node scripts/verify-release-files.js
          if ($LASTEXITCODE -ne 0) { throw 'Installer/manifest integrity mismatch.' }
      - name: Publish official APEX Settings update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versions = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if (@($versions | ForEach-Object { $_.tagName }) -contains 'v4.4.3') { throw 'Stable version already exists.' }
          $notes = @'
          APEX Management Studio 4.4.3 — Simplified Completed QA Inventory Tab
          
          Completed QA is now an Inventory tab, not a separate sidebar section. Scan a single active Asset ID or serial number, then click Move to Completed QA. No QA pallet selection, creation or pallet movement is required.
          
          The move saves the individual asset Location field as Completed QA and hides it from active inventory and work views. The asset's existing pallet ID stays unchanged, along with refurbishment, repair, respray, QC, manual diagnostics sync results, notes and history.
          
          The Completed QA tab retains its asset register, search, printed A4 manifest, location-reconciliation option for older 4.4.1 records, and restore actions. Direct QA assets can be restored without altering their pallet ID. If the pallet itself remains archived in Completed QA, restoring the individual device must detach it from that pallet to return it to active Inventory.
          
          No Supabase migration or change to the Settings updater. Update from Settings > APEX Update Centre > Check for updates. Test one real asset before processing batches.
          '@
          gh release create v4.4.3 dist/APEX-Refurb-Studio-Setup-4.4.3.exe dist/APEX-Refurb-Studio-Setup-4.4.3.exe.blockmap dist/latest.yml --repo $env:GITHUB_REPOSITORY --target 129165802a78b775ed34ad131361b4f1f251c824 --latest --title 'APEX Management Studio 4.4.3 - Simple Completed QA Inventory Scan' --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Stable release publishing failed.' }
      - name: Verify stable GitHub release and update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = gh release view v4.4.3 --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($r.tagName -ne 'v4.4.3' -or $r.isDraft -or $r.isPrerelease) { throw 'Release was not published as stable.' }
          $names = @($r.assets | ForEach-Object { $_.name })
          foreach ($name in @('APEX-Refurb-Studio-Setup-4.4.3.exe','APEX-Refurb-Studio-Setup-4.4.3.exe.blockmap','latest.yml')) {
            if ($names -notcontains $name) { throw "Published update bundle missing $name" }
          }
          if ((gh api repos/$env:GITHUB_REPOSITORY/releases/latest --jq .tag_name) -ne 'v4.4.3') { throw 'Stable GitHub latest channel not updated.' }
          Write-Host 'Verified official APEX 4.4.3 stable update, Windows Setup EXE and latest.yml.'
