name: Publish APEX 4.4.2 Completed QA Archive Stable
on:
  push:
    branches:
      - release/4.4.2-completed-qa-location
    paths:
      - '.github/workflows/publish-completed-qa-location-442.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: apex-442-stable-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Confirm verified unchanged production identity and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tested = 'bf5847c478a5056a13423a7e3ab3de856d05cb01'
          git merge-base --is-ancestor $tested HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Release branch does not descend from the verified build.' }
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          if ($p.version -ne '4.4.2' -or $p.build.appId -ne 'com.apex.inventory' -or $p.build.publish[0].releaseType -ne 'release') { throw 'Incorrect stable update channel or app identity.' }
          $verification = gh api repos/$env:GITHUB_REPOSITORY/actions/runs/45139726145 --jq '{conclusion:.conclusion,head_sha:.head_sha}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify Windows build.' }
          $v = $verification | ConvertFrom-Json
          if ($v.conclusion -ne 'success' -or $v.head_sha -ne $tested) { throw 'The pinned Windows build was not successful.' }
          $current = gh api repos/$env:GITHUB_REPOSITORY/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $current -ne 'v4.4.1') { throw 'Stable channel has changed: review before replacing it.' }
          $versions = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing tags.' }
          if (@($versions | ForEach-Object { $_.tagName }) -contains 'v4.4.2') { throw '4.4.2 already exists: do not overwrite.' }
      - name: Retrieve previously tested installer, blockmap and latest metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          gh run download 45139726145 --repo $env:GITHUB_REPOSITORY --name APEX-4.4.2-Completed-QA-Location-Verified-Candidate --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not download tested build artifacts.' }
          foreach ($f in @('APEX-Refurb-Studio-Setup-4.4.2.exe','APEX-Refurb-Studio-Setup-4.4.2.exe.blockmap','latest.yml')) {
            if (!(Test-Path (Join-Path dist $f))) { throw "Missing required release file: $f" }
          }
          $manifest = Get-Content dist/latest.yml -Raw
          if ($manifest -notmatch 'version: 4\.4\.2') { throw 'Update feed is not version 4.4.2.' }
          node scripts/verify-release-files.js
          if ($LASTEXITCODE -ne 0) { throw 'Installer/manifest integrity mismatch.' }
      - name: Publish official APEX Settings update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versions = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if (@($versions | ForEach-Object { $_.tagName }) -contains 'v4.4.2') { throw 'Stable version already exists.' }
          $notes = @'
          APEX Management Studio 4.4.2 — Completed QA Standalone Section and Individual Asset Location
          
          Completed QA is now its own main navigation section, not an Inventory subtab. The regular Inventory tab list no longer contains Completed QA. The archive view and printable A4 manifest remain available.
          
          Each asset's actual stored Location field is now saved as "Completed QA" when it is archived, not merely derived from a pallet's storage location. Moving an existing whole pallet into Completed QA updates individual Locations for the affected assets using the existing inventory update API on cloud connections, while keeping their pallet IDs. Scanning a single asset into a QA pallet also saves Location = Completed QA without changing its pallet ID.
          
          In Device Details, Completed QA is now an explicit Location dropdown option. Saving an asset into Completed QA navigates to the separate archive rather than opening a duplicate new asset form. The manifest and Completed QA register show the actual stored Location rather than a hardcoded label. The "Fix existing QA asset locations" action lets you explicitly reconcile already-archived records from 4.4.1.
          
          Restoring a pallet or individual asset clears its Completed QA Location, retaining the same pallet ID for whole-pallet restoration. Refurbishment progress, repair/respray statuses, notes, manual diagnostics sync and history remain intact. No database migration or automatic test approval.
          
          Update through Settings > APEX Update Centre > Check for updates. Test one asset and one pallet first. Existing APEX 4.4.1 remains available if needed.
          '@
          gh release create v4.4.2 dist/APEX-Refurb-Studio-Setup-4.4.2.exe dist/APEX-Refurb-Studio-Setup-4.4.2.exe.blockmap dist/latest.yml --repo $env:GITHUB_REPOSITORY --target bf5847c478a5056a13423a7e3ab3de856d05cb01 --latest --title 'APEX Management Studio 4.4.2 - Completed QA Standalone Location' --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Stable release publishing failed.' }
      - name: Verify stable GitHub release and update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = gh release view v4.4.2 --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($r.tagName -ne 'v4.4.2' -or $r.isDraft -or $r.isPrerelease) { throw 'Release was not published as stable.' }
          $names = @($r.assets | ForEach-Object { $_.name })
          foreach ($name in @('APEX-Refurb-Studio-Setup-4.4.2.exe','APEX-Refurb-Studio-Setup-4.4.2.exe.blockmap','latest.yml')) {
            if ($names -notcontains $name) { throw "Published update bundle missing $name" }
          }
          if ((gh api repos/$env:GITHUB_REPOSITORY/releases/latest --jq .tag_name) -ne 'v4.4.2') { throw 'Stable GitHub latest channel not updated.' }
          Write-Host 'Verified official APEX 4.4.2 stable update, Windows Setup EXE and latest.yml.'
