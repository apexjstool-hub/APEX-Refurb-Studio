name: Publish APEX 4.4.1 Completed QA Archive Stable
on:
  push:
    branches:
      - release/4.4.1-completed-qa
    paths:
      - '.github/workflows/publish-completed-qa-441.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: apex-441-stable-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Confirm verified unchanged production identity and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tested = '42dcc618b189a143c5784d76993d99a91c692249'
          git merge-base --is-ancestor $tested HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Release branch does not descend from the verified build.' }
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          if ($p.version -ne '4.4.1' -or $p.build.appId -ne 'com.apex.inventory' -or $p.build.publish[0].releaseType -ne 'release') { throw 'Incorrect stable update channel or app identity.' }
          $verification = gh api repos/$env:GITHUB_REPOSITORY/actions/runs/45137542460 --jq '{conclusion:.conclusion,head_sha:.head_sha}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify Windows build.' }
          $v = $verification | ConvertFrom-Json
          if ($v.conclusion -ne 'success' -or $v.head_sha -ne $tested) { throw 'The pinned Windows build was not successful.' }
          $current = gh api repos/$env:GITHUB_REPOSITORY/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $current -ne 'v4.4.0') { throw 'Stable channel has changed: review before replacing it.' }
          $versions = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing tags.' }
          if (@($versions | ForEach-Object { $_.tagName }) -contains 'v4.4.1') { throw '4.4.1 already exists: do not overwrite.' }
      - name: Retrieve previously tested installer, blockmap and latest metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          gh run download 45137542460 --repo $env:GITHUB_REPOSITORY --name APEX-4.4.1-Completed-QA-Verified-Candidate --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not download tested build artifacts.' }
          foreach ($f in @('APEX-Refurb-Studio-Setup-4.4.1.exe','APEX-Refurb-Studio-Setup-4.4.1.exe.blockmap','latest.yml')) {
            if (!(Test-Path (Join-Path dist $f))) { throw "Missing required release file: $f" }
          }
          $manifest = Get-Content dist/latest.yml -Raw
          if ($manifest -notmatch 'version: 4\.4\.0') { throw 'Update feed is not version 4.4.1.' }
          node scripts/verify-release-files.js
          if ($LASTEXITCODE -ne 0) { throw 'Installer/manifest integrity mismatch.' }
      - name: Publish official APEX Settings update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versions = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if (@($versions | ForEach-Object { $_.tagName }) -contains 'v4.4.1') { throw 'Stable version already exists.' }
          $notes = @'
          APEX Management Studio 4.4.1 — Completed QA Archive and Manifest
          
          Adds a dedicated Completed QA tab in the Inventory area. Create the reserved Completed QA pallet storage location, then move existing pallets into it using the normal pallet location workflow. Devices assigned to those pallets are archived from active Inventory, Dashboard, Work Queue, Pallets, Reports, asset search and other active UI sections. Original asset records and pallet IDs are never deleted or renamed.
          
          Within Completed QA: scan active assets directly onto archived pallets, filter by pallet or asset ID, inspect a full register, print an A4 QA manifest and restore an individual asset or entire pallet to active inventory. The printable manifest shows Brand, Model, Asset ID, Serial, Pallet ID, Location ID (Completed QA), recorded Repair and Respray stages, Refurbishment status and QC checklist status. A repair is never silently marked complete simply because its pallet was moved to Completed QA; unfinished work is clearly shown as outstanding.
          
          Archive status is a reversible view derived from the existing pallet storage location. No Supabase database schema migration, no asset deletion, no duplicate inventory database and no automatic changes to diagnostics pass/fail or refurbishment QC. Current production app identity, sign-in, diagnostic sync, label printing and Settings update centre remain unchanged.
          
          Upgrade through Settings > APEX Update Centre > Check for updates. After installation, open Completed QA, click Create Completed QA location if it has not been created, then Move pallets into Completed QA. Validate the manifest on a small test pallet first. Keep a current backup of your inventory before changing live pallet assignments.
          '@
          gh release create v4.4.1 dist/APEX-Refurb-Studio-Setup-4.4.1.exe dist/APEX-Refurb-Studio-Setup-4.4.1.exe.blockmap dist/latest.yml --repo $env:GITHUB_REPOSITORY --target 42dcc618b189a143c5784d76993d99a91c692249 --latest --title 'APEX Management Studio 4.4.1 - Completed QA Archive & Manifest' --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Stable release publishing failed.' }
      - name: Verify stable GitHub release and update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = gh release view v4.4.1 --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($r.tagName -ne 'v4.4.1' -or $r.isDraft -or $r.isPrerelease) { throw 'Release was not published as stable.' }
          $names = @($r.assets | ForEach-Object { $_.name })
          foreach ($name in @('APEX-Refurb-Studio-Setup-4.4.1.exe','APEX-Refurb-Studio-Setup-4.4.1.exe.blockmap','latest.yml')) {
            if ($names -notcontains $name) { throw "Published update bundle missing $name" }
          }
          if ((gh api repos/$env:GITHUB_REPOSITORY/releases/latest --jq .tag_name) -ne 'v4.4.1') { throw 'Stable GitHub latest channel not updated.' }
          Write-Host 'Verified official APEX 4.4.1 stable update, Windows Setup EXE and latest.yml.'
